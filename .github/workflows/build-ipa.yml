name: Build iOS IPA (Fix2 paired UI images)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: xcode-27
    timeout-minutes: 152
    steps:
      - name: Check out source, submodules, and Git LFS assets
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Restore cached Manic app
        id: manic-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/BaseManicApp
          key: manic-sideload-acnl-touch-v3

      - name: Install C++ compiler cache
        run: brew install ccache glslang spirv-cross

      - name: Restore Azahar compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/azahar-ccache
          key: azahar-ios-ccache-v1-${{ github.run_id }}
          restore-keys: |
            azahar-ios-ccache-v1-

      - name: Show Xcode version and schemes
        if: steps.manic-cache.outputs.cache-hit != 'true'
        run: |
          xcodebuild -version
          xcodebuild -list -project ManicEmu/ManicEmu.xcodeproj

      - name: Resolve packages and correct Device package platform
        if: steps.manic-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project ManicEmu/ManicEmu.xcodeproj -scheme ManicEmuSideload -derivedDataPath "$RUNNER_TEMP/DerivedData"
          DEVICE_PACKAGE="$RUNNER_TEMP/DerivedData/SourcePackages/checkouts/Device/Package.swift"
          if [ ! -f "$DEVICE_PACKAGE" ]; then
            DEVICE_PACKAGE="$(find "$HOME/Library/Developer/Xcode/DerivedData" "$RUNNER_TEMP/DerivedData" -path '*/checkouts/Device/Package.swift' -print -quit 2>/dev/null || true)"
          fi
          test -n "$DEVICE_PACKAGE"
          test -f "$DEVICE_PACKAGE"
          sed -i '' '1s/5.0/5.1/' "$DEVICE_PACKAGE"
          sed -i '' 's/\.iOS(\.v9)/.iOS(.v13)/' "$DEVICE_PACKAGE"
          head -n 1 "$DEVICE_PACKAGE" | grep -F 'swift-tools-version:5.1'
          grep -F '.iOS(.v13)' "$DEVICE_PACKAGE"

      - name: Check out ACNL Azahar core source
        uses: actions/checkout@v4
        with:
          repository: fragglerockspock/azahar-acnl
          ref: a07e420f10d5831b52b3ec557e6b382e2be998c7
          path: azahar-acnl
          submodules: recursive
          fetch-depth: 1

      - name: Build ACNL Azahar core for iOS ARM64
        working-directory: azahar-acnl
        env:
          CCACHE_DIR: ${{ runner.temp }}/azahar-ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          set -euo pipefail
          python3 tools/test_leaf_tool_ring.py
          python3 tools/test_leaf_ui.py
          ASAN_OPTIONS=detect_leaks=0 LEAF_SANITIZE=1 python3 tools/test_leaf_top_layout.py
          glslangValidator -V src/video_core/host_shaders/vulkan_present.vert -o "$RUNNER_TEMP/leaf-vertex.spv"
          glslangValidator -V src/video_core/host_shaders/vulkan_present.frag -o "$RUNNER_TEMP/leaf-switch.spv"
          glslangValidator -V -DARRAY_DYNAMIC_INDEX=1 src/video_core/host_shaders/vulkan_present.frag -o "$RUNNER_TEMP/leaf-dynamic.spv"
          spirv-cross "$RUNNER_TEMP/leaf-vertex.spv" --msl --msl-ios --msl-version 20100 --output "$RUNNER_TEMP/leaf-vertex.metal"
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          for LEAF_VARIANT in switch dynamic; do
            spirv-cross "$RUNNER_TEMP/leaf-$LEAF_VARIANT.spv" --msl --msl-ios --msl-version 20100 --output "$RUNNER_TEMP/leaf-$LEAF_VARIANT.metal"
            xcrun --sdk iphoneos metal -std=ios-metal2.1 -c "$RUNNER_TEMP/leaf-$LEAF_VARIANT.metal" -o "$RUNNER_TEMP/leaf-$LEAF_VARIANT.air"
            swift tools/test_leaf_alpha_metal.swift "$RUNNER_TEMP/leaf-vertex.metal" "$RUNNER_TEMP/leaf-$LEAF_VARIANT.metal"
          done
          cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_LIBRETRO=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS=-DIOS \
            -DCMAKE_CXX_FLAGS=-DIOS \
            -DIOS=ON \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCITRA_USE_PRECOMPILED_HEADERS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_OPT=OFF \
            . -B build/ios-arm64
          cmake --build build/ios-arm64 --target citra_libretro --config Release --parallel 4
          ccache --show-stats
          strip -x build/ios-arm64/bin/Release/azahar_libretro.dylib
          python3 -c 'from pathlib import Path; data=Path("build/ios-arm64/bin/Release/azahar_libretro.dylib").read_bytes(); assert all(s in data for s in (b"Leaf ToolRing software overlay active", b"Leaf ToolRing Vulkan overlay active", b"Leaf ToolRing icon archive loaded:", b"Leaf UI texture registry:", b"Leaf UI software composition active", b"Leaf UI Vulkan composition active", b"LeafKeyTexel", b"UI FIX 2W REG ")), "Missing ToolRing presentation path"'
          test -s build/ios-arm64/bin/Release/azahar_libretro.dylib

      - name: Archive sideload configuration
        if: steps.manic-cache.outputs.cache-hit != 'true'
        run: |
          xcodebuild archive \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration SideloadRelease \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -archivePath "$RUNNER_TEMP/ManicEmu.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Preserve unmodified Manic app
        if: steps.manic-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/BaseManicApp"
          ditto "$RUNNER_TEMP/ManicEmu.xcarchive/Products/Applications/ManicEmuSideload.app" "$RUNNER_TEMP/BaseManicApp/ManicEmuSideload.app"

      - name: Cache unmodified Manic app
        if: steps.manic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/BaseManicApp
          key: manic-sideload-acnl-touch-v3

      - name: Save Azahar compiler cache
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/azahar-ccache
          key: azahar-ios-ccache-v1-${{ github.run_id }}

      - name: Integrate ACNL Azahar core into archived app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/BaseManicApp/ManicEmuSideload.app"
          FRAMEWORK_PATH="$APP_PATH/Frameworks/azahar.libretro.framework"
          CORE_SOURCE="$GITHUB_WORKSPACE/azahar-acnl/build/ios-arm64/bin/Release/azahar_libretro.dylib"
          test -d "$FRAMEWORK_PATH"
          test -f "$FRAMEWORK_PATH/Info.plist"
          test -s "$CORE_SOURCE"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$FRAMEWORK_PATH/Info.plist")"
          test "$EXECUTABLE" = "azahar.libretro"
          cp "$CORE_SOURCE" "$FRAMEWORK_PATH/$EXECUTABLE"
          install_name_tool -id '@rpath/azahar.libretro.framework/azahar.libretro' "$FRAMEWORK_PATH/$EXECUTABLE"
          rm -rf "$FRAMEWORK_PATH/_CodeSignature"
          file "$FRAMEWORK_PATH/$EXECUTABLE" | grep -F 'arm64'
          otool -D "$FRAMEWORK_PATH/$EXECUTABLE" | grep -F '@rpath/azahar.libretro.framework/azahar.libretro'
          test -s "$FRAMEWORK_PATH/$EXECUTABLE"

      - name: Trim package to the ACNL core and 3DS skins
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/BaseManicApp/ManicEmuSideload.app"
          FRAMEWORKS_PATH="$APP_PATH/Frameworks"
          CORES_PATH="$APP_PATH/Cores"
          SYSTEM_PATH="$APP_PATH/System.core"
          test -s "$FRAMEWORKS_PATH/azahar.libretro.framework/azahar.libretro"
          for CORE_DIRECTORY in "$FRAMEWORKS_PATH" "$CORES_PATH"; do
            if [ -d "$CORE_DIRECTORY" ]; then
              find "$CORE_DIRECTORY" -mindepth 1 -maxdepth 1 -type d -name '*.libretro.framework' ! -name 'azahar.libretro.framework' -exec rm -rf {} +
            fi
          done
          if [ -d "$SYSTEM_PATH" ]; then
            find "$SYSTEM_PATH" -maxdepth 1 -type f \( -name '*.manicskin' -o -name '*.skininfo' \) ! -name '3DS.manicskin' ! -name '3DS_FLEX.manicskin' ! -name '3DS.skininfo' -delete
          fi
          test -s "$FRAMEWORKS_PATH/azahar.libretro.framework/azahar.libretro"
          find "$FRAMEWORKS_PATH" -mindepth 1 -maxdepth 1 -type d -name '*.libretro.framework' -print

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/BaseManicApp/ManicEmuSideload.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/ManicEmu.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/ManicEmu-unsigned.ipa"
          test -s "$GITHUB_WORKSPACE/ManicEmu-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManicEmu-ACNL-IPA
          path: ManicEmu-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
