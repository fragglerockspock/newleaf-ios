name: Repair Git LFS assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-lfs.yml"

permissions:
  contents: write

jobs:
  transfer-lfs:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out private repository without downloading LFS
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Fetch LFS assets from the original Manic repository
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git remote add upstream https://github.com/Manic-EMU/ManicEMU.git
          git fetch upstream main:refs/remotes/upstream/main
          git lfs fetch upstream refs/remotes/upstream/main

      - name: Verify required LFS objects are present
        shell: bash
        run: |
          set -euo pipefail
          git lfs ls-files --long HEAD
          git lfs fsck --objects HEAD
          git lfs fsck --objects refs/remotes/upstream/main

      - name: Upload only LFS objects referenced by the current commit
        shell: bash
        run: |
          set -euo pipefail
          git lfs ls-files --long HEAD | awk '{print $1}' | sort -u > /tmp/lfs-oids.txt
          test -s /tmp/lfs-oids.txt
          git lfs push --object-id origin $(cat /tmp/lfs-oids.txt)
