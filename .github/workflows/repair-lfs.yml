name: Repair Git LFS assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer-lfs:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out private repository without downloading LFS
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Fetch LFS assets from the original Manic repository
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git remote add upstream https://github.com/Manic-EMU/ManicEMU.git
          git fetch upstream main
          git lfs fetch upstream main

      - name: Verify required LFS objects are present
        shell: bash
        run: |
          set -euo pipefail
          git lfs ls-files
          git lfs fsck --objects HEAD

      - name: Upload the private repository's required LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git lfs push origin HEAD
